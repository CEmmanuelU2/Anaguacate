<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64" height="64">

    <!-- Degradado para la cáscara -->
    <defs>
        <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#66BB6A"/>
            <stop offset="100%" stop-color="#388E3C"/>
        </linearGradient>

        <!-- Degradado para la pulpa -->
        <linearGradient id="fleshGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#DCE775"/>
            <stop offset="100%" stop-color="#AEEA00"/>
        </linearGradient>
    </defs>

    <!-- Cuerpo exterior -->
    <path d="M32 4
           C18 4, 8 20, 8 34
           C8 52, 20 60, 32 60
           C44 60, 56 52, 56 34
           C56 20, 46 4, 32 4 Z"
          fill="url(#skinGradient)"
          stroke="#2E7D32"
          stroke-width="2"/>

    <!-- Pulpa interior -->
    <path d="M32 10
           C22 10, 14 22, 14 34
           C14 48, 24 54, 32 54
           C40 54, 50 48, 50 34
           C50 22, 42 10, 32 10 Z"
          fill="url(#fleshGradient)"
          stroke="#9CCC65"
          stroke-width="1.5"/>

    <!-- Semilla -->
    <circle cx="32" cy="38" r="7"
            fill="#8D6E63"
            stroke="#5D4037"
            stroke-width="2"/>

    <!-- Brillo (highlight) -->
    <ellipse cx="26" cy="20" rx="5" ry="8"
             fill="white" opacity="0.25"/>
</svg>